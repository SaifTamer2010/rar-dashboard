name: Force Refresh After Deploy

on:
  push:
    branches:
      - main

jobs:
  force-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment
        run: sleep 60

      - name: Trigger force refresh
        run: |
          curl -X POST https://www.dailydashboard.site/api/admin/force-refresh \
          -H "Content-Type: application/json" \
          -H "x-admin-secret: ${{ secrets.ADMIN_SECRET }}"
